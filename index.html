<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gestao de Funcionarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">

    <h1 class="mb-4">Cadastro de Funcionarios</h1>

    <form id="form-funcionario" class="row g-2 mb-4">
      <div class="col-md-3">
        <input type="text" id="nome" class="form-control" placeholder="Nome">
      </div>
      <div class="col-md-2">
        <input type="number" id="idade" class="form-control" placeholder="Idade">
      </div>
      <div class="col-md-3">
        <input type="text" id="cargo" class="form-control" placeholder="Cargo">
      </div>
      <div class="col-md-2">
        <input type="number" id="salario" class="form-control" placeholder="Salario">
      </div>
      <div class="col-md-2">
        <button type="button" id="btn-cadastrar" class="btn btn-primary w-100">Cadastrar</button>
      </div>
    </form>

    <table id="tabela-funcionarios" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Cargo</th>
          <th>Salario</th>
          <th>Acoes</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela"></tbody>
    </table>

    <h2 class="mt-4">Relatorios</h2>
    <div class="mb-3">
      <button id="btn-salario-alto" class="btn btn-outline-primary btn-sm">Salario acima de 5000</button>
      <button id="btn-media-salarial" class="btn btn-outline-primary btn-sm">Media Salarial</button>
      <button id="btn-cargos-unicos" class="btn btn-outline-primary btn-sm">Cargos Unicos</button>
      <button id="btn-nomes-maiusculo" class="btn btn-outline-primary btn-sm">Nomes em Maiusculo</button>
    </div>
    <div id="relatorios" class="alert alert-light border"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
